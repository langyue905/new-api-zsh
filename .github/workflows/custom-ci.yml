name: Custom CI

on:
  pull_request:
    branches:
      - custom/main
  push:
    branches:
      - custom/main

permissions:
  contents: read

concurrency:
  group: custom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify custom repository boundary
        run: bash scripts/custom/verify-foundation.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint changed frontend files
        if: github.event_name == 'pull_request'
        working-directory: web
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --relative=web "origin/${BASE_REF}...HEAD" -- src | grep -E '\.(ts|tsx)$' || true)
          if (( ${#files[@]} )); then
            bunx oxlint -c .oxlintrc.json "${files[@]}"
          fi
      - name: Type-check frontend
        working-directory: web
        run: bun run typecheck
      - name: Test frontend
        working-directory: web
        run: bun run test
      - name: Build frontend
        working-directory: web
        run: bun run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Create frontend embed placeholder
        shell: bash
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Vet backend modules
        run: |
          go vet ./...
          (cd relaykit && go vet ./...)
      - name: Run backend tests
        run: make test

  image-build:
    needs:
      - repository-guards
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: new-api-zsh:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
